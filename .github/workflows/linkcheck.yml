name: link-check
# Daily: open the link of every open row in the Sheet and mark jobs that no longer exist
# as Closed, then rebuild the Top 30 tab. Never pings Discord.
on:
  schedule:
    - cron: "30 11 * * *"   # daily, 11:30 UTC (6:30am Toronto), after the sweep
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be closed"
        type: boolean
        default: false
  push:
    branches: [linkcheck]   # TEMP: dry run on the feature branch, removed before merge

permissions:
  contents: read

concurrency:
  group: sweep   # shares the sweep group so Sheet writers never overlap
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private config
        uses: actions/checkout@v4
        with:
          repository: takatoshilee/job-radar-config
          ssh-key: ${{ secrets.CONFIG_DEPLOY_KEY }}
          path: .private-config
      - name: Install private config
        run: |
          cp .private-config/companies.yaml config/companies.yaml
          cp .private-config/profile.yaml config/profile.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[sheet]"

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS" > google-creds.json
          else
            echo "ERROR: GOOGLE_CREDENTIALS secret missing" && exit 1
          fi

      - name: Check links
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH: google-creds.json
          PREPARE_URL: ${{ vars.PREPARE_URL }}
          DRY: ${{ github.event_name == 'push' || inputs.dry_run == true }}
        run: |
          set -o pipefail
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          python -m job_radar --check-links $flag | tee linkcheck.log
          { echo '```'; grep -E "^LINKCHECK" linkcheck.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
